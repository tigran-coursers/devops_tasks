# =====================================================================================================
#  LEVEL 3 - DEPLOY THE SITE WITH A GITHUB ACTIONS PIPELINE
# =====================================================================================================
#
#  Until now GitHub published your site by itself ("Deploy from a branch"). Now YOU describe the
#  deployment in a pipeline. Why? A pipeline can run checks before the publish, and you see every
#  deployment, with its log, in the "Actions" tab.
#
#  WHERE: copy this file into YOUR repository, to   .github/workflows/pages.yml   (create the folders), and fill it there.
#
#  BEFORE you push this file: Settings -> Pages -> "Build and deployment" -> Source: choose "GitHub Actions".
#
#  How to work: remove the "# " in front of the lines, replace every _____ , then run ./check.sh
#  (YAML uses SPACES, never tabs. A line that starts with # is a comment.)
#
#  TODO 3.1  The name of the pipeline, and when it starts: on every push to main, and by hand
#  (workflow_dispatch adds a "Run workflow" button in the Actions tab).
#
# name: Deploy to GitHub Pages
#
# on:
#   push:
#     branches: [ _____ ]
#   workflow_dispatch:
#
#  TODO 3.2  The permissions. The pipeline may read the code, and it needs two special permissions
#  to publish a Pages site: "pages: write" and "id-token: write".
#
# permissions:
#   contents: read
#   pages: _____
#   id-token: _____
#
#  TODO 3.3  Only ONE deployment at a time (if two run together, they could publish in the wrong order).
#  A deployment that already started must NOT be cancelled in the middle.
#
# concurrency:
#   group: pages
#   cancel-in-progress: _____
