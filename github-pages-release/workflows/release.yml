#  LEVEL 5 - AUTOMATIC RELEASES
# =====================================================================================================
#
#  In level 4 you made a release by hand, with the mouse. Now a pipeline does it for you:
#  you push a TAG (for example v1.2.0), and the pipeline makes the GitHub Release, writes the release notes,
#  and attaches a file with the site (site.zip) that people can download.
#
#  WHERE: copy this file into YOUR repository, to   .github/workflows/release.yml   (create the folders), and fill it there.
#
#  How to work: remove the "# " in front of the lines, replace every _____ , then run ./check.sh
#
