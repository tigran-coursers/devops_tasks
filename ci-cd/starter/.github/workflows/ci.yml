# =====================================================================================================
#  YOUR PIPELINE - the file that you write in this module
# =====================================================================================================
#
#  GitHub Actions starts this file by itself, when something happens in your repository.
#  Goal: when somebody pushes to the branch "main", GitHub must run 3 stages, one after the other:
#
#        BUILD  ──►  TEST  ──►  PACKAGE   (──►  DEPLOY, the bonus)
#
#  HOW TO WORK
#    1. Write a level below (remove the "# " in front of the lines, and replace every _____ ).
#    2. Run  ./check.sh   It reads this file and tells you which checks pass.
#    3. When the levels are green, push to GitHub and open the "Actions" tab of your repository.
#
#  YAML RULES
#    - The SPACES are the structure: 2 spaces for each new level. NEVER use a tab.
#    - A line that starts with # is a comment. The whole file is comments now, so nothing runs yet.
#
#  The README.md of the module explains every level in more detail.
# =====================================================================================================


